name: C2ME Build Script

on:
  push: {}
  pull_request: {}

permissions:
  packages: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: true

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 25
        java-package: jdk

    - name: Install LLVM
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "20.1.8"
        force-url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-Linux-X64.tar.xz"
        directory: ${{ runner.temp }}/llvm

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
        cache-cleanup: never

    - name: Build C2ME
      run: |
        ./gradlew clean build --stacktrace
      env:
        GPR_MAVEN_USER: ${{ github.actor }}
        GPR_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: upload to modrinth and curseforge
      run: ./gradlew modrinth publishMainPublicationToCurseForge
      if: github.ref == 'refs/heads/dev/26.2.0'
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_UPLOAD_TOKEN }}
        CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        GITHUB_EVENT_RAW_PATH: ${{ github.event_path }}
        GPR_MAVEN_USER: ${{ github.actor }}
        GPR_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: c2me-artifact
        path: 'build/libs/*.jar'
      
